<!DOCTYPE html>
<html>
<head>
  <title>Movie Game</title>
  <style>
    body {
      background-image: url('https://raw.githubusercontent.com/myasus0098/my-website/main/A%20(3).png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      background-color: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .frame img {
      max-width: 500px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="https://raw.githubusercontent.com/myasus0098/my-website/main/150432-removebg-preview.png" alt="Framed Image">
  </div>
</body>
</html>
