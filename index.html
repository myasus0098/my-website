<!DOCTYPE html>
<html>
<head>
  <title>Movie Guess Game</title>
  <style>
    body {
      background-image: url('https://raw.githubusercontent.com/myasus0098/my-website/main/A%20(3).png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content {
      margin-top: 60px;
      text-align: center;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 200px;
      margin-top: 20px;
    }

    .buttons {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .open-btn { background-color: green; color: white; }
    .next-btn { background-color: red; color: white; }
    .submit-btn { background-color: blue; color: white; }
  </style>
</head>
<body>

  <div class="content">
    <!-- Removed the image -->
    <input type="text" placeholder="Enter movie name..." />
  </div>

  <div class="buttons">
    <button class="open-btn">OPEN</button>
    <button class="submit-btn">SUBMIT</button>
    <button class="next-btn">NEXT</button>
  </div>

</body>
</html>
