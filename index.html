<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Guessing Game</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0808;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
    }

    .background-text {
      position: absolute;
      top: 45%;
      left: 5%;
      font-size: 220px;
      color: #00796b;
      opacity: 0.2;
      font-weight: bold;
      z-index: 0;
    }

    .score {
      position: absolute;
      top: 40px;
      width: 60px;
      height: 60px;
      background-color: #7a0e0e;
      border-radius: 50%;
      text-align: center;
      line-height: 1.2;
      font-size: 28px;
      font-weight: bold;
    }

    .score span {
      display: block;
      font-size: 20px;
      margin-top: -5px;
    }

    .score.a {
      right: 150px;
    }

    .score.b {
      right: 60px;
    }

    .image-frame {
      position: relative;
      width: 70%;
      height: 400px;
      margin: 140px auto 0;
      border: 4px solid white;
      background-color: black;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #movieImage {
      max-width: 100%;
      max-height: 100%;
      display: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 40px;
    }

    button, input[type="text"] {
      font-size: 18px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      outline: none;
    }

    .open-btn {
      background-color: #7a0e0e;
      color: white;
      font-weight: bold;
      width: 120px;
    }

    .next-btn {
      background-color: #7a0e0e;
      color: white;
      font-weight: bold;
      width: 90px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: #d1bff8;
      border-radius: 8px;
      padding: 0 10px;
    }

    .input-wrapper label {
      font-weight: bold;
      margin-right: 8px;
      font-size: 14px;
      color: white;
    }

    .input-wrapper input {
      border: none;
      padding: 10px;
      width: 200px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="background-text">GUESS THE</div>

  <div class="score a">A<span id="scoreA">0</span></div>
  <div class="score b">B<span id="scoreB">0</span></div>

  <div class="image-frame">
    <img id="movieImage" src="https://upload.wikimedia.org/wikipedia/en/8/8a/Dark_Knight.jpg" alt="Movie Frame">
  </div>

  <div class="controls">
    <button class="open-btn" onclick="showImage()">OPEN</button>

    <div class="input-wrapper">
      <label for="movieInput">MOVIE</label>
      <input type="text" id="movieInput" placeholder="TYPE HERE..............">
    </div>

    <button class="next-btn" onclick="nextImage()">NEXT</button>
  </div>

  <script>
    const movieImage = document.getElementById('movieImage');

    function showImage() {
      movieImage.style.display = 'block';
    }

    function nextImage() {
      movieImage.style.display = 'none';
      document.getElementById('movieInput').value = '';
    }
  </script>
</body>
</html>
