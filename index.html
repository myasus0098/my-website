<!DOCTYPE html>
<html>
<head>
  <title>Movie Guess Game</title>
  <style>
    body {
      background-image: url('https://raw.githubusercontent.com/myasus0098/my-website/main/A%20(5).png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-scores {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .player {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .highlight {
      background-color: gold !important;
      color: black;
    }

    .plus-btn {
      background-color: orange;
      color: black;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .timer {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      font-weight: bold;
      z-index: 20;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-counter {
      font-size: 10px;
      font-weight: bold;
      color: black;
      z-index: 20;
    }

    .content {
      margin-top: 60px;
      text-align: center;
    }

    .frame-box {
      border-radius: 12px;
      padding: 0;
      width: 850px;
      height: 350px;
      overflow: hidden;
      position: absolute;
      z-index: 5;
      cursor: move;
      display: none;
    }

    .frame-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .buttons {
      position: absolute;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .open-btn { background-color: green; color: white; }
    .next-btn { background-color: red; color: white; }
    .prev-btn { background-color: blue; color: white; }
  </style>
</head>
<body>

  <div class="player-scores">
    <div class="player" id="player-a">Player A: <span id="score-a">0</span> <button class="plus-btn" onclick="addPoints('A')">+</button></div>
    <div class="player" id="player-b">Player B: <span id="score-b">0</span> <button class="plus-btn" onclick="addPoints('B')">+</button></div>
    <div class="player" id="player-c">Player C: <span id="score-c">0</span> <button class="plus-btn" onclick="addPoints('C')">+</button></div>
    <div class="player" id="player-d">Player D: <span id="score-d">0</span> <button class="plus-btn" onclick="addPoints('D')">+</button></div>
  </div>

  <div class="timer" id="timer">15</div>

  <div class="content">
    <div class="frame-box" id="draggable-frame">
      <img id="frame-image" src="https://raw.githubusercontent.com/myasus0098/my-website/main/inception-paris.jpg" alt="Movie Frame" />
    </div>
  </div>

  <div class="buttons">
    <div class="frame-counter">Frame <span id="frame-counter">1</span></div>
    <button class="open-btn" onclick="startTimer(); showFrameBox();">OPEN</button>
    <button class="prev-btn" onclick="previousFrame()">PREVIOUS</button>
    <button class="next-btn" onclick="nextFrame()">NEXT</button>
  </div>

  <script>
    let timerElement = document.getElementById('timer');
    let counterElement = document.getElementById('frame-counter');
    let scores = {
      A: 0,
      B: 0,
      C: 0,
      D: 0
    };

    let frames = [
      "https://raw.githubusercontent.com/myasus0098/my-website/main/inception-paris.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/Godzilla_vs_Kong_025.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/kong-skull-island.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/a-quiet-place.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/the-incredible-hulk.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/Underwater_032.jpg",
      "https://raw.githubusercontent.com/myasus0098/my-website/main/images/godzilla-king-of-the-monsters.jpg"
    ];

    let currentFrame = 0;
    let timer;
    let timeLeft = 15;

    function startTimer() {
      clearInterval(timer);
      timeLeft = 15;
      timerElement.textContent = timeLeft;
      timerElement.style.color = 'white';
      timer = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 5) {
          timerElement.style.color = 'red';
        }
        if (timeLeft === 0) {
          clearInterval(timer);
        }
      }, 1000);
    }

    function showFrameBox() {
      const frame = document.getElementById('draggable-frame');
      frame.style.display = 'block';
      frame.style.top = '37%';
      frame.style.left = '47%';
      frame.style.transform = 'translate(-50%, -50%)';
      frame.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function addPoints(player) {
      scores[player] += 10;
      document.getElementById(`score-${player.toLowerCase()}`).textContent = scores[player];
      updateHighlight();
    }

    function updateHighlight() {
      const maxScore = Math.max(...Object.values(scores));
      ['A', 'B', 'C', 'D'].forEach(p => {
        const el = document.getElementById(`player-${p.toLowerCase()}`);
        if (scores[p] === maxScore && maxScore > 0) {
          el.classList.add('highlight');
        } else {
          el.classList.remove('highlight');
        }
      });
    }

    function updateFrameCounter() {
      counterElement.textContent = currentFrame + 1;
    }

    function nextFrame() {
      currentFrame = (currentFrame + 1) % frames.length;
      document.getElementById('frame-image').src = frames[currentFrame];
      document.getElementById('draggable-frame').style.display = 'none';
      timerElement.textContent = '15';
      timerElement.style.color = 'white';
      clearInterval(timer);
      updateFrameCounter();
    }

    function previousFrame() {
      currentFrame = (currentFrame - 1 + frames.length) % frames.length;
      document.getElementById('frame-image').src = frames[currentFrame];
      document.getElementById('draggable-frame').style.display = 'none';
      timerElement.textContent = '15';
      timerElement.style.color = 'white';
      clearInterval(timer);
      updateFrameCounter();
    }

    const frame = document.getElementById('draggable-frame');
    let isDragging = false;
    let offsetX, offsetY;

    frame.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - frame.getBoundingClientRect().left;
      offsetY = e.clientY - frame.getBoundingClientRect().top;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        frame.style.left = `${e.clientX - offsetX}px`;
        frame.style.top = `${e.clientY - offsetY}px`;
        frame.style.transform = 'none';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    updateFrameCounter();
  </script>

</body>
</html>
