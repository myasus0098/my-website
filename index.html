<body>
  <h1>🎬 Movie Guessing Game</h1>

  <!-- LOBBY -->
  <div id="lobby">
    <p>Select your role:</p>
    <button onclick="chooseRole('A')">I'm Player A</button>
    <button onclick="chooseRole('B')">I'm Player B</button>
  </div>

  <!-- GAME UI -->
  <div id="game" style="display: none;">
    <h2 id="turnText">Player A's Turn</h2>
    <img id="movieImage" src="" alt="Movie Frame" style="width:400px; filter: blur(8px);"><br><br>
    
    <input type="text" id="guessInput" placeholder="Guess the movie...">
    <button onclick="checkGuess()">Submit</button><br><br>

    <button id="openBtn" onclick="revealImage()">Open</button>
    <button id="nextBtn" onclick="nextImage()">Next</button><br><br>

    <div id="message"></div>
    <div id="scoreDisplay">Score A: 0 | Score B: 0</div>
  </div>
