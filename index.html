<!DOCTYPE html>
<html>
<head>
  <title>Movie Guess Game - Solo Mode</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white h-screen flex items-center justify-center">
  <div id="game" class="w-full h-full p-6 relative">
    <!-- Score -->
    <div class="absolute top-4 right-4 z-10">
      <div class="bg-green-700 w-24 h-24 flex items-center justify-center rounded-full text-2xl font-bold" id="scoreSolo">Score: 0</div>
    </div>

    <!-- Game content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full">
      <!-- Image Frame -->
      <div id="imageBox" class="w-[600px] h-[300px] bg-black border-4 border-white hidden mb-4">
        <img id="gameImage" src="" alt="Guess" class="w-full h-full object-cover" />
      </div>

      <!-- Timer -->
      <div id="timer" class="text-3xl font-bold text-yellow-300 hidden mb-4">10</div>

      <!-- Input & Buttons -->
      <input type="text" id="guessInput" placeholder="Guess the animal..." class="text-black p-2 text-xl rounded mb-4" />
      <div class="flex gap-4">
        <button onclick="openImage()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">OPEN</button>
        <button onclick="nextImage()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">NEXT</button>
      </div>
    </div>
  </div>

<script>
  let currentImage = 0;
  let score = 0;
  let timerInterval;
  let roundActive = false;

  const images = [
    { url: "https://images.unsplash.com/photo-1583337130417-3346a1c2528e", answer: "cat" },
    { url: "https://images.unsplash.com/photo-1508672019048-805c876b67e2", answer: "dog" },
    { url: "https://images.unsplash.com/photo-1601758123927-1987fdd9c9a4", answer: "lion" },
    { url: "https://images.unsplash.com/photo-1595433562696-d34df4b5d6bc", answer: "elephant" }
  ];

  function openImage() {
    const img = document.getElementById('gameImage');
    img.src = images[currentImage].url;
    document.getElementById('imageBox').classList.remove('hidden');
    startTimer();
    roundActive = true;
  }

  function startTimer() {
    let time = 10;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = time;
    timerEl.classList.remove('hidden');

    timerInterval = setInterval(() => {
      time--;
      timerEl.textContent = time;
      if (time <= 0) {
        clearInterval(timerInterval);
        timerEl.classList.add('hidden');
        roundActive = false;
        alert("Time's up! The answer was: " + images[currentImage].answer);
      }
    }, 1000);
  }

  document.getElementById('guessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && roundActive) {
      const guess = this.value.trim().toLowerCase();
      const correct = images[currentImage].answer;

      if (guess === correct) {
        clearInterval(timerInterval);
        roundActive = false;
        document.getElementById('timer').classList.add('hidden');
        score += 10;
        updateScore();
        alert(`🎉 Correct! +10 points`);
      }
    }
  });

  function updateScore() {
    document.getElementById('scoreSolo').textContent = `Score: ${score}`;
  }

  function nextImage() {
    currentImage = (currentImage + 1) % images.length;
    document.getElementById('imageBox').classList.add('hidden');
    document.getElementById('timer').classList.add('hidden');
    document.getElementById('guessInput').value = '';
    roundActive = false;
    clearInterval(timerInterval);
  }
</script>

</body>
</html>
