<!DOCTYPE html>
<html>
<head>
  <title>Movie Guess Game</title>
  <style>
    body {
      background-image: url('https://raw.githubusercontent.com/myasus0098/my-website/main/A%20(3).png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    img {
      width: 200px;
      height: auto;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
      width: 200px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .open-btn { background-color: green; color: white; }
    .next-btn { background-color: red; color: white; }
    .submit-btn { background-color: blue; color: white; }
  </style>
</head>
<body>

  <img src="https://raw.githubusercontent.com/myasus0098/my-website/main/150432-removebg-preview.png" alt="Guess Image">

  <input type="text" placeholder="Enter movie name..." />

  <div class="buttons">
    <button class="open-btn">OPEN</button>
    <button class="submit-btn">SUBMIT</button>
    <button class="next-btn">NEXT</button>
  </div>

</body>
</html>
