<!DOCTYPE html>
<html>
<head>
  <title>Movie Guess Game</title>
  <style>
    body {
      background-image: url('https://raw.githubusercontent.com/myasus0098/my-website/main/A%20(3).png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-scores {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .timer {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .content {
      margin-top: 60px;
      text-align: center;
    }

    .frame-box {
      background-color: white;
      border-radius: 12px;
      padding: 0;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 720px;
      height: 405px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      overflow: hidden;
    }

    .frame-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .input-area {
      position: absolute;
      bottom: 90px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 200px;
    }

    .buttons {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .open-btn { background-color: green; color: white; }
    .next-btn { background-color: red; color: white; }
    .submit-btn { background-color: blue; color: white; }
  </style>
</head>
<body>

  <div class="player-scores">
    <div class="player" id="player-a">Player A: 0</div>
    <div class="player" id="player-b">Player B: 0</div>
  </div>

  <div class="timer" id="timer">Timer: 0</div>

  <div class="content">
    <div class="frame-box">
      <img src="https://raw.githubusercontent.com/myasus0098/my-website/main/inception-paris.jpg" alt="Movie Frame" />
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="movieInput" placeholder="Enter movie name..." />
  </div>

  <div class="buttons">
    <button class="open-btn" onclick="startTimer()">OPEN</button>
    <button class="submit-btn" onclick="submitGuess()">SUBMIT</button>
    <button class="next-btn">NEXT</button>
  </div>

  <script>
    let timerElement = document.getElementById('timer');
    let playerAScore = 0;
    let playerBScore = 0;
    let timer;
    let timeLeft = 15;

    function startTimer() {
      clearInterval(timer);
      timeLeft = 15;
      timerElement.textContent = 'Timer: ' + timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        timerElement.textContent = 'Timer: ' + timeLeft;
        if (timeLeft === 0) {
          clearInterval(timer);
          updateScore();
        }
      }, 1000);
    }

    function submitGuess() {
      const input = document.getElementById('movieInput').value.trim().toLowerCase();
      if (input === 'correct') {
        alert('Correct Guess!');
      }
    }

    function updateScore() {
      playerAScore += 10;
      document.getElementById('player-a').textContent = 'Player A: ' + playerAScore;
    }
  </script>

</body>
</html>
