<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Movie Game</title>
  <style>
    body {
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #game-container {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 20px;
      padding: 20px;
    }
    #image-container {
      position: relative;
      background-color: #222;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #frame {
      max-width: 100%;
      max-height: 80vh;
      display: none;
      border: 4px solid white;
      border-radius: 8px;
    }
    #open-btn {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: red;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }
    #tools {
      margin: 10px 0;
    }
    #tools input[type="color"], #tools input[type="range"], #tools button {
      margin-right: 10px;
    }
    button.active {
      background-color: #ffcc00;
    }
    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .score {
      background-color: #333;
      padding: 10px;
      border-radius: 50%;
      text-align: center;
      font-size: 18px;
    }
    #guess-input, #next-btn {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    canvas {
      border: 2px solid #333;
      border-radius: 10px;
      background-color: white;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div>
      <div id="tools">
        <input type="color" id="color-picker" value="#000000">
        <input type="range" id="brush-size" min="1" max="40" value="5" title="Brush Size">
        <button id="pencil-tool">✏️</button>
        <button id="brush-tool">🖌️</button>
        <button id="eraser-tool">🧽</button>
        <button id="clear-canvas">🗑️</button>
      </div>
      <canvas id="canvas" width="800" height="500"></canvas>
      <div id="image-container">
        <img id="frame" src="" alt="Movie Frame">
        <button id="open-btn">OPEN</button>
      </div>
    </div>
    <div id="sidebar">
      <div class="score" id="score-a">A: 0</div>
      <div class="score" id="score-b">B: 0</div>
      <input type="text" id="guess-input" placeholder="MOVIE">
      <button id="next-btn">NEXT</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let drawing = false;
    let currentTool = 'pencil';
    let brushColor = '#000000';
    let brushSize = 5;

    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.lineCap = 'round';
      ctx.lineWidth = brushSize;

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = brushColor;
      }

      ctx.stroke();
    });

    canvas.addEventListener('mouseup', () => {
      drawing = false;
      ctx.closePath();
    });

    canvas.addEventListener('mouseleave', () => {
      drawing = false;
    });

    document.getElementById('color-picker').addEventListener('input', (e) => {
      brushColor = e.target.value;
    });

    document.getElementById('brush-size').addEventListener('input', (e) => {
      brushSize = e.target.value;
    });

    document.getElementById('pencil-tool').addEventListener('click', () => {
      currentTool = 'pencil';
      setActiveTool('pencil-tool');
    });

    document.getElementById('brush-tool').addEventListener('click', () => {
      currentTool = 'brush';
      setActiveTool('brush-tool');
    });

    document.getElementById('eraser-tool').addEventListener('click', () => {
      currentTool = 'eraser';
      setActiveTool('eraser-tool');
    });

    document.getElementById('clear-canvas').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById('open-btn').addEventListener('click', () => {
      document.getElementById('frame').style.display = 'block';
    });

    function setActiveTool(id) {
      document.querySelectorAll('#tools button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
